  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^1.0.4
  shelf_static: ^1.1.2
  http: ^1.2.0
